<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Companion</title>
    <link rel="icon" type="image/png" href="/favicon.ico?v=2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Auth Container (Login / Register) -->
    <div id="auth-container" class="d-none">
        <div class="container">
            <div class="row justify-content-center min-vh-100 align-items-center">
                <div class="col-md-5 col-lg-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-mortarboard-fill display-1 text-primary"></i>
                        <h2 class="mt-2">Student Companion</h2>
                        <p class="text-muted">Your all-in-one academic assistant</p>
                    </div>
                    <div id="auth-form-container"></div>
                    <p class="text-center mt-3">
                        <a href="#" id="auth-toggle-link" class="text-decoration-none">Create an account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Shell -->
    <div id="app-container" class="d-none">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg sticky-top shadow-sm" id="main-navbar">
            <div class="container-fluid">
                <button class="btn btn-link text-decoration-none d-lg-none" id="sidebar-toggle">
                    <i class="bi bi-list fs-4"></i>
                </button>
                <a class="navbar-brand fw-bold" href="#dashboard">
                    <i class="bi bi-mortarboard-fill text-primary"></i> Student Companion
                </a>
                <div class="d-flex align-items-center gap-2 ms-auto">
                    <!-- Notification Bell -->
                    <div class="dropdown">
                        <button class="btn btn-link text-decoration-none position-relative" data-bs-toggle="dropdown" id="notif-bell">
                            <i class="bi bi-bell fs-5"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" id="notif-count">0</span>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end p-2" style="width:320px;max-height:400px;overflow-y:auto" id="notif-dropdown">
                            <div class="d-flex justify-content-between align-items-center px-2 mb-2">
                                <strong>Notifications</strong>
                                <button class="btn btn-sm btn-link text-decoration-none" id="mark-all-read-btn">Mark all read</button>
                            </div>
                            <div id="notif-list"><p class="text-muted text-center small">No notifications</p></div>
                        </div>
                    </div>
                    <!-- User Dropdown -->
                    <div class="dropdown">
                        <button class="btn btn-link text-decoration-none dropdown-toggle d-flex align-items-center gap-1" data-bs-toggle="dropdown">
                            <span id="user-avatar-small" class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:32px;height:32px;font-size:14px;">U</span>
                            <span id="user-name-nav" class="d-none d-md-inline">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#profile"><i class="bi bi-person"></i> Profile</a></li>
                            <li><a class="dropdown-item" href="#notifications"><i class="bi bi-bell"></i> Notifications</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div class="d-flex">
            <!-- Sidebar -->
            <nav class="sidebar d-lg-block collapse" id="sidebar">
                <ul class="nav flex-column pt-2">
                    <li class="nav-item"><a class="nav-link" href="#dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#tasks"><i class="bi bi-list-check"></i> Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="#attendance"><i class="bi bi-calendar-check"></i> Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="#exams"><i class="bi bi-journal-bookmark"></i> Exam Prep</a></li>
                    <li class="nav-item"><a class="nav-link" href="#timetable"><i class="bi bi-table"></i> Timetable</a></li>
                    <li class="nav-item"><a class="nav-link" href="#gpa"><i class="bi bi-calculator"></i> GPA Calculator</a></li>
                    <li class="nav-item"><a class="nav-link" href="#expenses"><i class="bi bi-wallet2"></i> Expenses</a></li>
                    <li class="nav-item"><a class="nav-link" href="#notifications"><i class="bi bi-bell"></i> Notifications</a></li>
                    <li class="nav-item"><a class="nav-link" href="#profile"><i class="bi bi-person"></i> Profile</a></li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="main-content p-4" id="content"></main>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <!-- Shared Modals Container -->
    <div id="modals-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/modules/dashboard.js"></script>
    <script src="/js/modules/tasks.js"></script>
    <script src="/js/modules/attendance.js"></script>
    <script src="/js/modules/exams.js"></script>
    <script src="/js/modules/timetable.js"></script>
    <script src="/js/modules/gpa.js"></script>
    <script src="/js/modules/expenses.js"></script>
    <script src="/js/modules/notifications.js"></script>
    <script src="/js/modules/profile.js"></script>
</body>
</html>
